<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to Glory</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#14181f; --muted:#6b7480; --border:#e3e6eb;
  --green:#0f9d58; --green-bg:#e3f5ea; --red:#d93025; --red-bg:#fbe6e4; --accent:#3b5bdb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --text:#e8ebf0; --muted:#8b95a3; --border:#262c36;
    --green:#3ddc84; --green-bg:#12301f; --red:#ff6b61; --red-bg:#3a1917; --accent:#7c93ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --text:#e8ebf0; --muted:#8b95a3; --border:#262c36;
  --green:#3ddc84; --green-bg:#12301f; --red:#ff6b61; --red-bg:#3a1917; --accent:#7c93ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:20px;margin:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--border);padding:7px 10px;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:650;margin-top:2px}
.pos{color:var(--green)} .neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthbar h2{font-size:17px;margin:0}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr)) minmax(90px,1fr);gap:6px;min-width:700px}
.dow{font-size:12px;color:var(--muted);text-align:center;padding:2px}
.day{min-height:88px;border:1px solid var(--border);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg)}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.35;cursor:default}
.day.win{background:var(--green-bg);border-color:transparent}
.day.loss{background:var(--red-bg);border-color:transparent}
.day.today{outline:2px solid var(--accent)}
.day .n{font-size:12px;color:var(--muted)}
.day .amt{font-size:15px;font-weight:650;text-align:right}
.day .note{font-size:10px;color:var(--muted);text-align:right}
.day .pct{font-size:11px;color:var(--muted);text-align:right}
.week{border:1px dashed var(--border);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;min-height:88px}
.week .n{font-size:12px;color:var(--muted)}
.week .amt{font-size:14px;font-weight:650;text-align:right}
dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-size:16px}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.row label{font-size:12px;color:var(--muted)}
.row input{width:100%}
.btns{display:flex;justify-content:space-between;gap:8px}
.sign{display:flex;gap:6px}
.sign button{flex:1}
.sign button.on-win{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.sign button.on-loss{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.hint{font-size:12px;color:var(--muted)}
.bal{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bal input{width:120px}
svg text{fill:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📒 Road to Glory</h1>
    <div class="tools">
      <label class="bal">Starting balance <input type="number" id="start" step="0.01" min="0" placeholder="0.00"></label>
      <select id="cur" title="Currency"></select>
      <button id="exp">Export</button>
      <button id="imp">Import</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="monthbar">
      <button id="prev">←</button>
      <h2 id="mlabel"></h2>
      <div class="tools"><button id="todaybtn">Today</button><button id="next">→</button></div>
    </div>
    <div class="scroll"><div class="cal" id="cal"></div></div>
  </div>

  <div class="card">
    <div class="monthbar"><h2>Equity curve (all time)</h2><span class="hint" id="curvehint"></span></div>
    <div class="scroll"><svg id="chart" viewBox="0 0 900 240" width="100%" preserveAspectRatio="none" style="min-width:600px;height:240px"></svg></div>
  </div>

  <p class="hint">Data is saved in this browser only. Use Export to back it up or move it to another device.</p>
</div>

<dialog id="dlg">
  <h3 id="dtitle"></h3>
  <div class="row">
    <label>Result</label>
    <div class="sign"><button id="bwin">Win</button><button id="bloss">Loss</button></div>
  </div>
  <div class="row">
    <label>Amount</label>
    <input type="number" id="amt" step="0.01" min="0" placeholder="0.00">
    <div class="hint" id="pcthint" style="margin-top:2px"></div>
  </div>
  <div class="row">
    <label>Note (optional)</label>
    <input type="text" id="note" maxlength="80" placeholder="e.g. overtraded, followed plan">
  </div>
  <div class="btns">
    <button id="del">Delete</button>
    <div class="tools"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
  </div>
</dialog>

<script>
(function(){
  var KEY = "daily_pnl_journal_v1";
  var CURS = {"USD":"$","EUR":"€","GBP":"£","EGP":"E£","SAR":"SAR ","AED":"AED "};
  var state = { entries:{}, cur:"USD", start:0 };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.entries) state = p; } } catch(e){}
  if (typeof state.start !== "number") state.start = 0;
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  var now = new Date();
  var view = { y: now.getFullYear(), m: now.getMonth() };
  var editKey = null, editSign = 1;

  function pad(n){ return String(n).padStart(2,"0"); }
  function key(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
  function sym(){ return CURS[state.cur] || ""; }
  function fmt(v, signed){
    var s = sym(), a = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
    if (v < 0) return "-" + s + a;
    return (signed && v > 0 ? "+" : "") + s + a;
  }
  function cls(v){ return v>0 ? "pos" : v<0 ? "neg" : ""; }

  var $ = function(id){ return document.getElementById(id); };

  // currency select
  var cs = $("cur");
  Object.keys(CURS).forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; cs.appendChild(o); });
  cs.value = state.cur;
  cs.onchange = function(){ state.cur = cs.value; persist(); render(); };
  var si = $("start");
  si.value = state.start ? state.start : "";
  si.onchange = function(){ var n = parseFloat(si.value); state.start = (isNaN(n) || n < 0) ? 0 : n; persist(); render(); };

  function balBefore(k){
    var b = state.start || 0;
    Object.keys(state.entries).forEach(function(kk){ if (kk < k) b += state.entries[kk].amount; });
    return b;
  }
  function pctStr(p){ return (p>0?"+":"") + p.toFixed(2) + "%"; }

  function render(){
    var y = view.y, m = view.m;
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    $("mlabel").textContent = months[m] + " " + y;

    // calendar
    var cal = $("cal"); cal.innerHTML = "";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun","Week"].forEach(function(d){
      var e = document.createElement("div"); e.className="dow"; e.textContent=d; cal.appendChild(e);
    });
    var first = new Date(y,m,1);
    var offset = (first.getDay()+6)%7; // Monday first
    var dim = new Date(y,m+1,0).getDate();
    var total = Math.ceil((offset+dim)/7)*7;
    var todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());
    var weekSum = 0, weekDays = 0, monthSum = 0, wins = 0, losses = 0, best = null, worst = null, ties = 0;

    for (var i=0;i<total;i++){
      var dn = i - offset + 1;
      var el = document.createElement("div");
      if (dn < 1 || dn > dim){
        el.className = "day out"; cal.appendChild(el);
      } else {
        var k = key(y,m,dn), ent = state.entries[k];
        el.className = "day";
        if (k === todayKey) el.className += " today";
        var html = '<div class="n">'+dn+'</div>';
        if (ent){
          var v = ent.amount;
          el.className += v>0 ? " win" : v<0 ? " loss" : "";
          var bb = balBefore(k);
          var pc = (state.start > 0 && bb > 0) ? '<div class="pct">'+pctStr(v/bb*100)+'</div>' : '';
          html += '<div><div class="amt '+cls(v)+'">'+fmt(v,true)+'</div>' + pc + (ent.note ? '<div class="note">'+esc(ent.note)+'</div>' : '') + '</div>';
          weekSum += v; weekDays++; monthSum += v;
          if (v>0) wins++; else if (v<0) losses++; else ties++;
          if (best===null || v>best.v) best={v:v,k:k};
          if (worst===null || v<worst.v) worst={v:v,k:k};
        } else {
          html += '<div></div>';
        }
        el.innerHTML = html;
        (function(kk){ el.onclick = function(){ openDlg(kk); }; })(k);
        cal.appendChild(el);
      }
      if (i % 7 === 6){
        var w = document.createElement("div"); w.className="week";
        var wk = Math.floor(i/7)+1;
        w.innerHTML = '<div class="n">Week '+wk+'</div><div class="amt '+(weekDays?cls(weekSum):"")+'">'+(weekDays?fmt(weekSum,true):"–")+'</div>';
        cal.appendChild(w); weekSum = 0; weekDays = 0;
      }
    }

    // stats
    var traded = wins + losses + ties;
    var wr = traded ? Math.round(wins/traded*100)+"%" : "–";
    var st = $("stats");
    var allTotal = 0, before = 0, mStart = key(y,m,1), hasAny = false;
    Object.keys(state.entries).forEach(function(k){
      var a = state.entries[k].amount; hasAny = true; allTotal += a; if (k < mStart) before += a;
    });
    var balance = state.start + allTotal, monthBase = state.start + before;
    var ret = (traded && monthBase > 0) ? (monthSum/monthBase*100) : null;
    st.innerHTML =
      stat("Account balance", (state.start > 0 || hasAny) ? fmt(balance) : "–", (state.start > 0 || hasAny) ? cls(allTotal) : "") +
      stat("Month P&L", traded? fmt(monthSum,true) : "–", cls(monthSum)) +
      stat("Month return", ret===null ? "–" : (ret>0?"+":"") + ret.toFixed(2) + "%", ret===null ? "" : cls(ret)) +
      stat("Green days", wins, "pos") +
      stat("Red days", losses, "neg") +
      stat("Day win rate", wr, "") +
      stat("Best day", best? fmt(best.v,true) : "–", best? cls(best.v):"") +
      stat("Worst day", worst? fmt(worst.v,true) : "–", worst? cls(worst.v):"");

    drawChart();
  }

  function stat(l,v,c){ return '<div class="stat"><div class="l">'+l+'</div><div class="v '+c+'">'+v+'</div></div>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function drawChart(){
    var svg = $("chart");
    var keys = Object.keys(state.entries).sort();
    if (!keys.length){ svg.innerHTML = '<text x="450" y="120" text-anchor="middle">Log a few days to see your equity curve</text>'; $("curvehint").textContent=""; return; }
    var base = state.start || 0, cum = 0, pts = [base];
    keys.forEach(function(k){ cum += state.entries[k].amount; pts.push(base + cum); });
    $("curvehint").innerHTML = (base > 0 ? 'Balance: <b>'+fmt(base+cum)+'</b> · ' : '') + 'P&amp;L: <b class="'+cls(cum)+'">'+fmt(cum,true)+'</b> over '+keys.length+' days';
    var W=900,H=240,P=30;
    var min = Math.min.apply(null,pts), max = Math.max.apply(null,pts);
    if (min===max){ min-=1; max+=1; }
    var xs = function(i){ return P + (W-2*P)*(pts.length===1?0:i/(pts.length-1)); };
    var ys = function(v){ return H-P - (H-2*P)*(v-min)/(max-min); };
    var d = pts.map(function(v,i){ return (i?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1); }).join(" ");
    var zero = ys(base);
    var color = cum>=0 ? "var(--green)" : "var(--red)";
    var area = d + " L"+xs(pts.length-1).toFixed(1)+" "+zero.toFixed(1)+" L"+xs(0).toFixed(1)+" "+zero.toFixed(1)+" Z";
    svg.innerHTML =
      '<line x1="'+P+'" x2="'+(W-P)+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--border)" stroke-dasharray="4 4"/>' +
      '<path d="'+area+'" fill="'+color+'" opacity=".12"/>' +
      '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/>' +
      '<text x="'+P+'" y="'+(P-10)+'">'+fmt(max)+'</text>' +
      '<text x="'+P+'" y="'+(H-8)+'">'+fmt(min)+'</text>' +
      '<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end">'+keys[keys.length-1]+'</text>' +
      '<text x="'+P+'" y="'+(H-8)+'" dx="70">'+keys[0]+'</text>';
  }

  // dialog
  var dlg = $("dlg");
  function updateHint(){
    var h = $("pcthint"), n = parseFloat($("amt").value), base = balBefore(editKey);
    if (!state.start) { h.textContent = "Set your starting balance to see the % of your account."; return; }
    if (base <= 0) { h.textContent = "Balance before this day: " + fmt(base); return; }
    if (isNaN(n) || n <= 0) { h.textContent = "Balance before this day: " + fmt(base); return; }
    h.textContent = pctStr(editSign*n/base*100) + " of your balance (" + fmt(base) + " before this day)";
  }
  function setSign(s){
    editSign = s;
    $("bwin").className = s>0 ? "on-win" : "";
    $("bloss").className = s<0 ? "on-loss" : "";
    updateHint();
  }
  function openDlg(k){
    editKey = k;
    var ent = state.entries[k];
    $("dtitle").textContent = new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
    $("amt").value = ent ? Math.abs(ent.amount) : "";
    $("note").value = ent && ent.note ? ent.note : "";
    setSign(ent && ent.amount<0 ? -1 : 1);
    $("del").style.visibility = ent ? "visible" : "hidden";
    dlg.showModal();
    setTimeout(function(){ $("amt").focus(); }, 30);
  }
  $("bwin").onclick = function(){ setSign(1); };
  $("bloss").onclick = function(){ setSign(-1); };
  $("amt").oninput = updateHint;
  $("cancel").onclick = function(){ dlg.close(); };
  $("save").onclick = function(){
    var raw = $("amt").value;
    if (raw === "") { dlg.close(); return; }
    var n = parseFloat(raw);
    if (isNaN(n)) return;
    state.entries[editKey] = { amount: Math.abs(n) * editSign, note: $("note").value.trim() };
    persist(); dlg.close(); render();
  };
  $("del").onclick = function(){ delete state.entries[editKey]; persist(); dlg.close(); render(); };
  dlg.addEventListener("keydown", function(e){ if (e.key==="Enter" && e.target.tagName!=="BUTTON"){ e.preventDefault(); $("save").click(); } });

  // nav
  $("prev").onclick = function(){ view.m--; if (view.m<0){ view.m=11; view.y--; } render(); };
  $("next").onclick = function(){ view.m++; if (view.m>11){ view.m=0; view.y++; } render(); };
  $("todaybtn").onclick = function(){ view = { y: now.getFullYear(), m: now.getMonth() }; render(); };

  // export / import
  $("exp").onclick = function(){
    try {
      var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "pnl-journal.json"; a.click();
    } catch(e){}
    // fallback for sandboxed pages where downloads are inert
    var ta = JSON.stringify(state);
    try { navigator.clipboard.writeText(ta); } catch(e){}
  };
  $("imp").onclick = function(){ $("file").click(); };
  $("file").onchange = function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var p = JSON.parse(r.result);
        if (p && p.entries){ state = p; if (!CURS[state.cur]) state.cur="USD"; if (typeof state.start !== "number") state.start = 0; cs.value = state.cur; si.value = state.start ? state.start : ""; persist(); render(); }
      } catch(err){}
    };
    r.readAsText(f);
  };

  render();
})();
</script>
</body>
</html>
